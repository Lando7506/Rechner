<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181b">
<title>Kurven-Analysator</title>
<style>
  :root{
    --case:#d9dbd7;
    --case-hi:#f2f3f1;
    --case-lo:#aeb1ac;
    --case-edge:#8b8e89;
    --lcd-bg:#c7d1bd;
    --lcd-bg-2:#bcc7b1;
    --lcd-ink:#1f2a1a;
    --lcd-ink-dim:rgba(31,42,26,0.45);
    --bezel:#1b1d1f;
    --key-dark:#3c4147;
    --key-dark-lo:#202327;
    --key-light:#eceeec;
    --key-light-lo:#a7aaa6;
    --key-fn:#5c6470;
    --key-fn-lo:#33383e;
    --key-text-light:#eef0ee;
    --key-text-dark:#22252a;
    --accent:#3f6fb0;
    --accent-lo:#25406b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #33383e 0%, #17191b 60%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:28px 10px 60px;
    font-family:"Helvetica Neue", Arial, sans-serif;
    user-select:none;
  }
  #stage{
    width:380px;
    transform-origin: top center;
  }
  .hint-below{
    text-align:center;
    color:#6b7178;
    font-size:11px;
    margin-top:14px;
    letter-spacing:0.02em;
    line-height:1.6;
  }
  .hint-below kbd{
    background:#2a2d31; border:1px solid #454a50; border-radius:3px; padding:1px 5px; color:#c9cdd1; font-family:monospace;
  }

  .calc{
    background:linear-gradient(155deg,var(--case-hi),var(--case) 45%,var(--case-lo));
    border-radius:20px;
    padding:14px 14px 18px;
    box-shadow:0 24px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -2px 4px rgba(0,0,0,0.08);
    border:1px solid var(--case-edge);
  }
  .calc-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 6px 10px;
  }
  .calc-brand{
    font-weight:800;
    font-size:14px;
    letter-spacing:0.05em;
    color:#454b51;
  }
  .calc-brand span{ color:var(--accent); }
  .calc-model{
    font-size:9px;
    letter-spacing:0.1em;
    color:#82888e;
    text-transform:uppercase;
  }

  .screen-bezel{
    background:var(--bezel);
    border-radius:9px;
    padding:10px 10px 6px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.7), inset 0 0 0 1px #000;
  }
  .lcd{
    background:linear-gradient(175deg,var(--lcd-bg),var(--lcd-bg-2));
    color:var(--lcd-ink);
    font-family:"SFMono-Regular", Consolas, "Courier New", monospace;
    font-size:12.5px;
    line-height:1.45;
    padding:8px 9px;
    height:196px;
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .lcd::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
    pointer-events:none;
    mix-blend-mode:multiply;
    opacity:0.35;
  }
  .lcd-line{ white-space:pre; }
  .lcd-inputline{ white-space:pre-wrap; word-break:break-all; margin-bottom:6px; }
  .lcd-hint{ color:var(--lcd-ink-dim); font-size:11px; margin-top:10px; }
  .lcd-error{ color:var(--lcd-ink); font-weight:700; margin-top:8px; white-space:pre-wrap; }
  .caret{
    display:inline-block; width:6px; height:12px; background:var(--lcd-ink);
    vertical-align:-1px; animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .lcd-scrollhint{
    position:absolute; right:6px; bottom:4px; font-size:10px; color:var(--lcd-ink-dim); font-weight:700;
  }
  .lcd-menu{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; }
  .lcd-title{ font-weight:800; font-size:16px; letter-spacing:0.04em; line-height:1.3; margin-bottom:10px; }
  .lcd-sub{ font-size:10.5px; line-height:1.7; color:var(--lcd-ink-dim); }
  #lcdCanvas{ width:100%; height:100%; display:block; }

  .softkeys{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
    padding:6px 2px 12px;
  }
  .softkey{
    background:#2c2f33;
    color:#8a9096;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:0.02em;
    text-align:center;
    padding:5px 0;
    border-radius:3px;
    border:1px solid #101214;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .softkey.active{ background:var(--accent); color:#fff; border-color:var(--accent-lo); }

  .navrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 12px;
  }
  .modecluster{ display:flex; flex-direction:column; gap:5px; }
  .modebtn{
    background:var(--key-fn);
    color:var(--key-text-light);
    border:none;
    border-radius:5px;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:5px 8px;
    box-shadow:0 2px 0 var(--key-fn-lo);
    cursor:pointer;
  }
  .modebtn:active{ transform:translateY(1px); box-shadow:none; }

  .dpad{ position:relative; width:78px; height:78px; flex-shrink:0; }
  .dpad button{
    position:absolute;
    background:var(--key-dark);
    color:var(--key-text-light);
    border:none;
    font-size:11px;
    box-shadow:0 2px 0 var(--key-dark-lo);
    cursor:pointer;
  }
  .dpad button:active{ transform:translateY(1px); box-shadow:none; }
  .dpad .up{ top:0; left:26px; width:26px; height:24px; border-radius:6px 6px 2px 2px; }
  .dpad .down{ bottom:0; left:26px; width:26px; height:24px; border-radius:2px 2px 6px 6px; }
  .dpad .left{ top:27px; left:0; width:24px; height:24px; border-radius:6px 2px 2px 6px; }
  .dpad .right{ top:27px; right:0; width:24px; height:24px; border-radius:2px 6px 6px 2px; }
  .dpad .center{ top:26px; left:25px; width:28px; height:26px; border-radius:4px; background:var(--accent); box-shadow:0 2px 0 var(--accent-lo); font-size:9px; font-weight:700; }

  .exitac{ display:flex; gap:6px; }
  .exitac button{
    background:var(--key-fn); color:var(--key-text-light); border:none; border-radius:5px;
    font-size:9px; font-weight:700; padding:6px 9px; box-shadow:0 2px 0 var(--key-fn-lo); cursor:pointer;
  }
  .exitac button:active{ transform:translateY(1px); box-shadow:none; }

  .keys{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
  }
  .key{
    border:none;
    border-radius:7px;
    padding:11px 0;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    background:var(--key-dark);
    color:var(--key-text-light);
    box-shadow:0 3px 0 var(--key-dark-lo), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .key:active{ transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,0.08); }
  .key.light{
    background:var(--key-light); color:var(--key-text-dark);
    box-shadow:0 3px 0 var(--key-light-lo), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .key.light:active{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.7); }
  .key.accent{
    background:var(--accent); color:#fff;
    box-shadow:0 3px 0 var(--accent-lo);
  }
  .key.accent:active{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.2); }
  .key.small{ font-size:10px; }

  @media (max-width:420px){
    body{ padding-top:14px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="calc">
    <div class="calc-top">
      <div class="calc-brand">graph<span>·fx</span></div>
      <div class="calc-model">Kurven-Analysator</div>
    </div>

    <div class="screen-bezel">
      <div class="lcd" id="lcd"></div>
    </div>

    <div class="softkeys" id="softkeys"></div>

    <div class="navrow">
      <div class="modecluster">
        <button class="modebtn" id="btnShift">SHIFT</button>
        <button class="modebtn" id="btnAlpha">ALPHA</button>
      </div>
      <div class="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="down" data-dir="down">▼</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="center" id="btnMenu">MENU</button>
      </div>
      <div class="exitac">
        <button id="btnExit">EXIT</button>
      </div>
    </div>

    <div class="keys">
      <button class="key light" data-char="x">X</button>
      <button class="key light" data-char="^">^</button>
      <button class="key light" data-char="sqrt(">√(</button>
      <button class="key light" data-char="(">(</button>
      <button class="key light" data-char=")">)</button>

      <button class="key small" data-char="sin(">sin</button>
      <button class="key small" data-char="cos(">cos</button>
      <button class="key small" data-char="tan(">tan</button>
      <button class="key small" data-char="ln(">ln</button>
      <button class="key small" data-char="exp(">eˣ</button>

      <button class="key small" data-char="pi">π</button>
      <button class="key small" data-char="e">e</button>
      <button class="key small" data-char="abs(">abs</button>
      <button class="key light" id="btnAC">AC</button>
      <button class="key light" id="btnDel">DEL</button>

      <button class="key" data-char="7">7</button>
      <button class="key" data-char="8">8</button>
      <button class="key" data-char="9">9</button>
      <button class="key" data-char="*">×</button>
      <button class="key" data-char="/">÷</button>

      <button class="key" data-char="4">4</button>
      <button class="key" data-char="5">5</button>
      <button class="key" data-char="6">6</button>
      <button class="key" data-char="+">+</button>
      <button class="key" data-char="-">−</button>

      <button class="key" data-char="1">1</button>
      <button class="key" data-char="2">2</button>
      <button class="key" data-char="3">3</button>
      <button class="key" data-char="(">(</button>
      <button class="key" data-char=")">)</button>

      <button class="key" data-char="0">0</button>
      <button class="key" data-char=".">.</button>
      <button class="key" data-char="-">(-)</button>
      <button class="key accent" id="btnExeSpacer" style="visibility:hidden;"></button>
      <button class="key accent" id="btnExe">EXE</button>
    </div>
  </div>
</div>

<div class="hint-below">
  Tippen geht auch per Tastatur · <kbd>Enter</kbd>=EXE · <kbd>⌫</kbd>=DEL · <kbd>Esc</kbd>=EXIT/AC · Pfeiltasten = Cursor / Seite / Scroll
</div>

<script>
(function(){
'use strict';

// =================================================================
// MATHE-ENGINE (Parser, Ableitung, Polynom-Werkzeuge, Analyse)
// =================================================================

function tokenize(input){
  const s = input.replace(/\s+/g,'');
  const tokens = [];
  let i=0;
  const isDigit = c=>c>='0'&&c<='9';
  const isAlpha = c=>/[a-zA-Z]/.test(c);
  while(i<s.length){
    const c = s[i];
    if(isDigit(c) || (c==='.' && isDigit(s[i+1]))){
      let j=i+1;
      while(j<s.length && (isDigit(s[j])||s[j]==='.')) j++;
      tokens.push({type:'NUM', value:parseFloat(s.slice(i,j))});
      i=j; continue;
    }
    if(isAlpha(c)){
      let j=i+1;
      while(j<s.length && isAlpha(s[j])) j++;
      tokens.push({type:'IDENT', value:s.slice(i,j)});
      i=j; continue;
    }
    if('+-*/^(),'.includes(c)){
      tokens.push({type:c});
      i++; continue;
    }
    throw new Error('Unerwartetes Zeichen: "'+c+'"');
  }
  return tokens;
}

const FUNCS = new Set(['sin','cos','tan','exp','ln','log','sqrt','abs']);
const CONSTS = new Set(['pi','e']);

function preprocess(input){
  return input
    .replace(/²/g,'^2').replace(/³/g,'^3')
    .replace(/(\d),(\d)/g,'$1.$2')
    .replace(/π/g,'pi');
}

function parse(input){
  const tokens = tokenize(preprocess(input));
  let pos = 0;
  function peek(){ return tokens[pos]; }
  function next(){ return tokens[pos++]; }
  function expect(type){
    const t = next();
    if(!t || t.type!==type) throw new Error('Erwartet "'+type+'"');
    return t;
  }
  function startsFactor(t){
    if(!t) return false;
    return t.type==='NUM' || t.type==='IDENT' || t.type==='(';
  }
  function parsePrimary(){
    const t = peek();
    if(!t) throw new Error('Ausdruck unvollstaendig');
    if(t.type==='NUM'){ next(); return {type:'num', value:t.value}; }
    if(t.type==='('){ next(); const e = parseExpr(); expect(')'); return e; }
    if(t.type==='IDENT'){
      const name = t.value.toLowerCase();
      next();
      if(FUNCS.has(name)){ expect('('); const arg = parseExpr(); expect(')'); return {type:'func', name, arg}; }
      if(CONSTS.has(name)) return {type:'const', name};
      if(name==='x') return {type:'var'};
      throw new Error('Unbekannt: "'+name+'"');
    }
    if(t.type==='-'){ next(); return {type:'neg', a: parseUnary()}; }
    if(t.type==='+'){ next(); return parseUnary(); }
    throw new Error('Unerwartetes Zeichen');
  }
  function parsePower(){
    const base = parsePrimary();
    if(peek() && peek().type==='^'){ next(); const exp = parseUnary(); return {type:'pow', a: base, b: exp}; }
    return base;
  }
  function parseUnary(){
    if(peek() && (peek().type==='-'||peek().type==='+')){
      const t = next(); const a = parseUnary();
      return t.type==='-' ? {type:'neg', a} : a;
    }
    return parsePower();
  }
  function parseTerm(){
    let node = parseUnary();
    for(;;){
      const t = peek();
      if(t && t.type==='*'){ next(); node = {type:'mul', a:node, b:parseUnary()}; continue; }
      if(t && t.type==='/'){ next(); node = {type:'div', a:node, b:parseUnary()}; continue; }
      if(startsFactor(t)){ node = {type:'mul', a:node, b:parseUnary()}; continue; }
      break;
    }
    return node;
  }
  function parseExpr(){
    let node = parseTerm();
    for(;;){
      const t = peek();
      if(t && t.type==='+'){ next(); node = {type:'add', a:node, b:parseTerm()}; continue; }
      if(t && t.type==='-'){ next(); node = {type:'sub', a:node, b:parseTerm()}; continue; }
      break;
    }
    return node;
  }
  const result = parseExpr();
  if(pos < tokens.length) throw new Error('Zeichen am Ende uebrig');
  return result;
}

function evaluate(node, x){
  switch(node.type){
    case 'num': return node.value;
    case 'var': return x;
    case 'const': return node.name==='pi'?Math.PI:Math.E;
    case 'add': return evaluate(node.a,x)+evaluate(node.b,x);
    case 'sub': return evaluate(node.a,x)-evaluate(node.b,x);
    case 'mul': return evaluate(node.a,x)*evaluate(node.b,x);
    case 'div': return evaluate(node.a,x)/evaluate(node.b,x);
    case 'pow': return Math.pow(evaluate(node.a,x), evaluate(node.b,x));
    case 'neg': return -evaluate(node.a,x);
    case 'func': {
      const v = evaluate(node.arg,x);
      switch(node.name){
        case 'sin': return Math.sin(v);
        case 'cos': return Math.cos(v);
        case 'tan': return Math.tan(v);
        case 'exp': return Math.exp(v);
        case 'ln': case 'log': return Math.log(v);
        case 'sqrt': return Math.sqrt(v);
        case 'abs': return Math.abs(v);
      }
    }
  }
  throw new Error('Unbekannter Knoten '+node.type);
}

function num(v){ return {type:'num', value:v}; }
function isZero(n){ return n.type==='num' && Math.abs(n.value) < 1e-12; }
function isOne(n){ return n.type==='num' && Math.abs(n.value-1) < 1e-12; }
function add(a,b){ return {type:'add', a, b}; }
function sub(a,b){ return {type:'sub', a, b}; }
function mul(a,b){ return {type:'mul', a, b}; }
function div(a,b){ return {type:'div', a, b}; }
function neg(a){ return {type:'neg', a}; }
function pw(a,b){ return {type:'pow', a, b}; }

function diff(node){
  switch(node.type){
    case 'num': return num(0);
    case 'var': return num(1);
    case 'const': return num(0);
    case 'add': return add(diff(node.a), diff(node.b));
    case 'sub': return sub(diff(node.a), diff(node.b));
    case 'neg': return neg(diff(node.a));
    case 'mul': return add(mul(diff(node.a), node.b), mul(node.a, diff(node.b)));
    case 'div': {
      if(node.b.type==='num') return div(diff(node.a), node.b);
      return div(sub(mul(diff(node.a), node.b), mul(node.a, diff(node.b))), pw(node.b, num(2)));
    }
    case 'pow': {
      const {a,b} = node;
      if(b.type==='num'){ return mul(mul(num(b.value), pw(a, num(b.value-1))), diff(a)); }
      if(a.type==='const' && a.name==='e'){ return mul(pw(a,b), diff(b)); }
      if(a.type==='num'){ return mul(mul(pw(a,b), num(Math.log(a.value))), diff(b)); }
      return mul(pw(a,b), add(mul(diff(b), {type:'func', name:'ln', arg:a}), div(mul(b, diff(a)), a)));
    }
    case 'func': {
      const u = node.arg, du = diff(u);
      switch(node.name){
        case 'sin': return mul({type:'func',name:'cos',arg:u}, du);
        case 'cos': return neg(mul({type:'func',name:'sin',arg:u}, du));
        case 'tan': return mul(div(num(1), pw({type:'func',name:'cos',arg:u}, num(2))), du);
        case 'exp': return mul({type:'func',name:'exp',arg:u}, du);
        case 'ln': case 'log': return div(du, u);
        case 'sqrt': return div(du, mul(num(2), {type:'func',name:'sqrt',arg:u}));
        case 'abs': return mul(div(u, {type:'func',name:'abs',arg:u}), du);
      }
    }
  }
  throw new Error('diff: unbekannt '+node.type);
}

function simplify(node){
  if(node.type==='num' || node.type==='var' || node.type==='const') return node;
  if(node.type==='neg'){
    const a = simplify(node.a);
    if(a.type==='num') return num(-a.value);
    if(a.type==='neg') return a.a;
    return {type:'neg', a};
  }
  if(node.type==='func'){
    const arg = simplify(node.arg);
    if(arg.type==='num'){
      let v;
      switch(node.name){
        case 'sin': v=Math.sin(arg.value); break;
        case 'cos': v=Math.cos(arg.value); break;
        case 'tan': v=Math.tan(arg.value); break;
        case 'exp': v=Math.exp(arg.value); break;
        case 'ln': case 'log': v=Math.log(arg.value); break;
        case 'sqrt': v=Math.sqrt(arg.value); break;
        case 'abs': v=Math.abs(arg.value); break;
      }
      return num(v);
    }
    return {type:'func', name:node.name, arg};
  }
  if(node.type==='pow'){
    const a = simplify(node.a), b = simplify(node.b);
    if(b.type==='num' && b.value===0) return num(1);
    if(b.type==='num' && b.value===1) return a;
    if(a.type==='num' && b.type==='num') return num(Math.pow(a.value,b.value));
    if(a.type==='num' && a.value===0) return num(0);
    if(a.type==='num' && a.value===1) return num(1);
    if(a.type==='pow' && a.b.type==='num' && b.type==='num') return simplify(pw(a.a, num(a.b.value*b.value)));
    return {type:'pow', a, b};
  }
  if(node.type==='mul'){
    const a = simplify(node.a), b = simplify(node.b);
    if(isZero(a) || isZero(b)) return num(0);
    if(isOne(a)) return b;
    if(isOne(b)) return a;
    if(a.type==='num' && b.type==='num') return num(a.value*b.value);
    if(a.type==='neg' && b.type==='neg') return simplify(mul(a.a,b.a));
    if(a.type==='neg') return simplify(neg(mul(a.a,b)));
    if(b.type==='neg') return simplify(neg(mul(a,b.a)));
    if(a.type==='mul' && a.a.type==='num' && b.type==='num') return simplify(mul(num(a.a.value*b.value), a.b));
    if(b.type==='mul' && b.a.type==='num' && a.type==='num') return simplify(mul(num(a.value*b.a.value), b.b));
    if(a.type==='num' && b.type==='mul' && b.a.type==='num') return simplify(mul(num(a.value*b.a.value), b.b));
    if(b.type==='num' && b.value===-1) return simplify(neg(a));
    if(a.type==='num' && a.value===-1) return simplify(neg(b));
    return {type:'mul', a, b};
  }
  if(node.type==='div'){
    const a = simplify(node.a), b = simplify(node.b);
    if(isZero(a) && !isZero(b)) return num(0);
    if(isOne(b)) return a;
    if(a.type==='num' && b.type==='num' && b.value!==0) return num(a.value/b.value);
    if(a.type==='mul' && a.a.type==='num' && b.type==='num') return simplify(mul(num(a.a.value/b.value), a.b));
    return {type:'div', a, b};
  }
  if(node.type==='add'){
    const a = simplify(node.a), b = simplify(node.b);
    if(isZero(a)) return b;
    if(isZero(b)) return a;
    if(a.type==='num' && b.type==='num') return num(a.value+b.value);
    if(b.type==='neg') return simplify(sub(a,b.a));
    return {type:'add', a, b};
  }
  if(node.type==='sub'){
    const a = simplify(node.a), b = simplify(node.b);
    if(isZero(b)) return a;
    if(isZero(a)) return simplify(neg(b));
    if(a.type==='num' && b.type==='num') return num(a.value-b.value);
    if(b.type==='neg') return simplify(add(a,b.a));
    return {type:'sub', a, b};
  }

}
function simplifyFixed(node, passes=6){ let cur = node; for(let i=0;i<passes;i++) cur = simplify(cur); return cur; }

function toStr(node){
  switch(node.type){
    case 'num': { const r = Math.round(node.value*1e9)/1e9; return String(r); }
    case 'var': return 'x';
    case 'const': return node.name;
    case 'neg': return '-'+wrapIfNeeded(node.a, node);
    case 'add': return toStr(node.a)+' + '+toStr(node.b);
    case 'sub': return toStr(node.a)+' - '+wrapIfNeeded(node.b, node, true);
    case 'mul': return wrapIfNeeded(node.a,node)+'·'+wrapIfNeeded(node.b,node);
    case 'div': return wrapIfNeeded(node.a,node)+'/'+wrapIfNeeded(node.b,node,true);
    case 'pow': return wrapIfNeeded(node.a,node)+'^'+wrapIfNeeded(node.b,node);
    case 'func': return node.name+'('+toStr(node.arg)+')';
  }
}
function prec(node){
  switch(node.type){ case 'add': case 'sub': return 1; case 'mul': case 'div': return 2; case 'neg': return 3; case 'pow': return 4; default: return 5; }
}
function wrapIfNeeded(child, parent, isRightOfMinusOrDiv){
  const cp = prec(child), pp = prec(parent);
  let needs = cp < pp;
  if(cp===pp && isRightOfMinusOrDiv && (child.type==='add'||child.type==='sub')) needs=true;
  const s = toStr(child);
  return needs ? '('+s+')' : s;
}

const EPS = 1e-9;
function polyTrim(p){ const r = p.slice(); while(r.length>1 && Math.abs(r[r.length-1])<EPS) r.pop(); return r; }
function polyAdd(p,q){ const n=Math.max(p.length,q.length); const r=[]; for(let i=0;i<n;i++) r.push((p[i]||0)+(q[i]||0)); return polyTrim(r); }
function polySub(p,q){ return polyAdd(p, q.map(v=>-v)); }
function polyScale(p,k){ return polyTrim(p.map(v=>v*k)); }
function polyMul(p,q){ const r=new Array(p.length+q.length-1).fill(0); for(let i=0;i<p.length;i++) for(let j=0;j<q.length;j++) r[i+j]+=p[i]*q[j]; return polyTrim(r); }
function hasVar(node){
  switch(node.type){
    case 'var': return true;
    case 'num': case 'const': return false;
    case 'neg': case 'func': return hasVar(node.arg||node.a);
    default: return hasVar(node.a) || hasVar(node.b);
  }
}
function astToPoly(node){
  switch(node.type){
    case 'num': return [node.value];
    case 'const': return [node.name==='pi'?Math.PI:Math.E];
    case 'var': return [0,1];
    case 'neg': { const p = astToPoly(node.a); return p===null ? null : polyScale(p,-1); }
    case 'add': { const p=astToPoly(node.a), q=astToPoly(node.b); return (p===null||q===null) ? null : polyAdd(p,q); }
    case 'sub': { const p=astToPoly(node.a), q=astToPoly(node.b); return (p===null||q===null) ? null : polySub(p,q); }
    case 'mul': { const p=astToPoly(node.a), q=astToPoly(node.b); return (p===null||q===null) ? null : polyMul(p,q); }
    case 'div': {
      if(hasVar(node.b)) return null;
      const p=astToPoly(node.a); if(p===null) return null;
      let qv; try{ qv = evaluate(node.b, 0); }catch(e){ return null; }
      if(!isFinite(qv) || qv===0) return null;
      return polyScale(p, 1/qv);
    }
    case 'pow': {
      if(hasVar(node.b)) return null;
      let n; try{ n = evaluate(node.b, 0); }catch(e){ return null; }
      if(!Number.isInteger(n) || n<0 || n>40) return null;
      const base = astToPoly(node.a); if(base===null) return null;
      let r = [1]; for(let i=0;i<n;i++) r = polyMul(r, base);
      return r;
    }
    case 'func': {
      if(hasVar(node.arg)) return null;
      try{ const v = evaluate(node, 0); return isFinite(v) ? [v] : null; }catch(e){ return null; }
    }
  }
  return null;
}
function polyDerivative(p){ if(p.length<=1) return [0]; const r=[]; for(let i=1;i<p.length;i++) r.push(i*p[i]); return polyTrim(r); }
function fmtNum(v){ return Math.round(v*1e9)/1e9; }
function polyToString(pAsc){
  const p = polyTrim(pAsc); const deg = p.length-1; let parts = [];
  for(let i=deg;i>=0;i--){
    let c = fmtNum(p[i]); if(Math.abs(c)<EPS) continue;
    const sign = c<0 ? '-' : (parts.length? '+' : ''); const ac = Math.abs(c);
    let term;
    if(i===0) term = String(ac);
    else if(i===1) term = (ac===1?'':ac+'·')+'x';
    else term = (ac===1?'':ac+'·')+'x^'+i;
    parts.push(sign + (sign? ' ':'') + term);
  }
  if(parts.length===0) return '0';
  return parts.join(' ').replace(/\+ -/g,'- ');
}

function divisorsOf(n){ n = Math.round(Math.abs(n)); if(n===0) return []; const ds=[]; for(let i=1;i<=n;i++) if(n%i===0) ds.push(i); return ds; }
function rationalCandidates(a0, an){
  const p = divisorsOf(a0), q = divisorsOf(an); const set = new Set();
  for(const pi of p) for(const qi of q){ set.add(pi/qi); set.add(-pi/qi); }
  return Array.from(set).sort((a,b)=>a-b);
}
function hornerEvalDesc(coeffsDesc, x){ let r=0; for(const c of coeffsDesc) r = r*x + c; return r; }
function syntheticDivide(coeffsDesc, r){
  const q=[coeffsDesc[0]]; for(let i=1;i<coeffsDesc.length;i++) q.push(coeffsDesc[i] + q[i-1]*r);
  const remainder = q.pop(); return {quotient:q, remainder};
}
function isAllIntegerCoeffs(coeffsDesc, tol=1e-7){ return coeffsDesc.every(c=>Math.abs(c-Math.round(c))<tol); }

function solveLowDegree(coeffsDesc){
  const n = coeffsDesc.length-1;
  if(n===0) return {roots:[], detail:{type:'const', value: coeffsDesc[0]}};
  if(n===1){ const [a,b]=coeffsDesc; const root = -b/a; return {roots:[root], detail:{type:'linear', a,b,root}}; }
  if(n===2){
    const [a,b,c]=coeffsDesc; const D = b*b-4*a*c;
    if(D<-1e-9) return {roots:[], detail:{type:'quadratic', a,b,c,D, complex:true}};
    const Dc = Math.max(D,0); const sq = Math.sqrt(Dc);
    const x1 = (-b+sq)/(2*a), x2=(-b-sq)/(2*a);
    const roots = Math.abs(D)<1e-9 ? [x1] : [x1,x2].sort((p,q)=>p-q);
    return {roots, detail:{type:'quadratic', a,b,c,D}};
  }
  throw new Error('degree>2');
}

function numericScanRoots(f, xMin, xMax, steps=4000){
  const found = []; let prevX = xMin, prevY = f(prevX);
  for(let i=1;i<=steps;i++){
    const x = xMin + (xMax-xMin)*i/steps; const y = f(x);
    if(isFinite(prevY) && isFinite(y)){
      if(Math.abs(prevY) < 1e-12){ found.push(prevX); }
      else if(prevY*y < 0){
        let a=prevX,b=x,fa=prevY,fb=y;
        for(let k=0;k<80;k++){
          const m=(a+b)/2, fm=f(m);
          if(Math.abs(fm)<1e-12 || (b-a)<1e-12){ a=b=m; break; }
          if((fa<0)===(fm<0)){a=m;fa=fm;} else {b=m;fb=fm;}
        }
        found.push((a+b)/2);
      }
    }
    prevX=x; prevY=y;
  }
  found.sort((a,b)=>a-b);
  const dedup=[]; for(const r of found){ if(dedup.length===0 || Math.abs(r-dedup[dedup.length-1])>1e-6) dedup.push(r); }
  return dedup;
}

function findPolynomialRoots(pAsc){
  let coeffs = polyTrim(pAsc).slice().reverse();
  const stages = []; const roots = []; const MAX_COEFF_FOR_EXACT = 2000;

  while(coeffs.length>1 && Math.abs(coeffs[coeffs.length-1])<1e-7){
    roots.push(0); coeffs = coeffs.slice(0,-1);
    stages.push({type:'zero-root', after:coeffs.slice()});
  }
  while(coeffs.length-1 > 2){
    const an = coeffs[0], a0 = coeffs[coeffs.length-1];
    if(!isAllIntegerCoeffs(coeffs) || Math.abs(an)>MAX_COEFF_FOR_EXACT || Math.abs(a0)>MAX_COEFF_FOR_EXACT){
      stages.push({type:'skip-exact', coeffs:coeffs.slice()}); break;
    }
    const cands = rationalCandidates(a0, an);
    const table = cands.map(r=>({x:r, fx: hornerEvalDesc(coeffs, r)}));
    let found = null;
    for(const row of table){ if(Math.abs(row.fx) < 1e-6){ found = row.x; break; } }
    stages.push({type:'guess-table', coeffs:coeffs.slice(), table, found});
    if(found===null) break;
    const {quotient} = syntheticDivide(coeffs, found);
    stages.push({type:'horner-division', coeffs:coeffs.slice(), root:found, quotient:quotient.slice()});
    roots.push(found);
    coeffs = polyTrim(quotient.slice().reverse()).slice().reverse();
    if(coeffs.length<1) coeffs=[0];
  }
  if(coeffs.length-1 <= 2 && coeffs.length>=1){
    const {roots:lowRoots, detail} = solveLowDegree(coeffs);
    stages.push({type:'low-degree', coeffs:coeffs.slice(), detail});
    roots.push(...lowRoots);
  } else if(coeffs.length-1 > 2){
    const f = x=>hornerEvalDesc(coeffs,x);
    const numRoots = numericScanRoots(f, -100, 100);
    stages.push({type:'numeric', coeffs:coeffs.slice(), roots:numRoots});
    roots.push(...numRoots);
  }
  const dedup = []; const sorted = roots.slice().sort((a,b)=>a-b);
  for(const r of sorted) if(dedup.length===0 || Math.abs(r-dedup[dedup.length-1])>1e-6) dedup.push(fmtNum(r));
  return {roots:dedup, stages};
}

function polySymmetry(pAsc){
  const trimmed = polyTrim(pAsc); let hasEven=false, hasOdd=false;
  trimmed.forEach((c,i)=>{ if(Math.abs(c)>EPS){ if(i%2===0) hasEven=true; else hasOdd=true; } });
  if(hasOdd && !hasEven) return 'odd';
  if(hasEven && !hasOdd) return 'even';
  return 'none';
}
function numericSymmetry(f){
  const samples = [0.5,1,1.7,2.3,3.1,4.9,7.3];
  let allEven=true, allOdd=true, any=false;
  for(const x of samples){
    const a = f(x), b = f(-x);
    if(!isFinite(a) || !isFinite(b)) continue;
    any = true; const scale = Math.max(1, Math.abs(a), Math.abs(b));
    if(Math.abs(b-a) > 1e-4*scale) allEven=false;
    if(Math.abs(b+a) > 1e-4*scale) allOdd=false;
  }
  if(!any) return 'none';
  if(allEven) return 'even';
  if(allOdd) return 'odd';
  return 'none';
}

function numericDomainGaps(f, xMin=-20, xMax=20, n=1600){
  const gaps=[];
  for(let i=0;i<=n;i++){ const x = xMin + (xMax-xMin)*i/n; const y = f(x); if(!isFinite(y)) gaps.push(x); }
  if(gaps.length===0) return [];
  const step = (xMax-xMin)/n; const clusters=[]; let cur=[gaps[0]];
  for(let i=1;i<gaps.length;i++){ if(gaps[i]-gaps[i-1] <= step*1.5) cur.push(gaps[i]); else { clusters.push(cur); cur=[gaps[i]]; } }
  clusters.push(cur);
  return clusters.map(c=>{
    const from=c[0], to=c[c.length-1];
    const touchesMin = from <= xMin+step, touchesMax = to >= xMax-step;
    if(to-from <= step*3) return {type:'point', x: fmtNum((from+to)/2)};
    if(touchesMin && !touchesMax) return {type:'below', x: fmtNum(to)};
    if(touchesMax && !touchesMin) return {type:'above', x: fmtNum(from)};
    return {type:'interval', from: fmtNum(from), to: fmtNum(to)};
  });
}

function polyEndBehaviour(pAsc){
  const p = polyTrim(pAsc); const n = p.length-1; const an = p[n];
  if(n===0) return {left:an, right:an, kind:'const'};
  const evenDeg = n%2===0; let left, right;
  if(evenDeg) { left = an>0? Infinity : -Infinity; right = left; }
  else { right = an>0? Infinity : -Infinity; left = -right; }
  return {left, right, kind:'poly', degree:n, leading:an};
}
function numericEndBehaviour(f){
  function trend(sign){
    const big = sign*1e3, bigger = sign*1e4; const a = f(big), b = f(bigger);
    if(Number.isNaN(a) || Number.isNaN(b)) return {type:'undefined'};
    if(!isFinite(a) || !isFinite(b) || Math.abs(a) > 1e8 || Math.abs(b) > 1e8){
      const s = !isFinite(a) ? a : (!isFinite(b) ? b : a); return {type:'infinite', sign: s>0?1:-1};
    }
    if(Math.abs(b-a) < 1e-3*Math.max(1,Math.abs(a))) return {type:'finite', value:a};
    return {type:'unknown'};
  }
  return {left: trend(-1), right: trend(1)};
}

function numericGuessTable(f, xMin, xMax, step){
  const rows=[];
  for(let x=xMin; x<=xMax+1e-9; x+=step){ const xr = fmtNum(x); const y = f(xr); rows.push({x:xr, fx: isFinite(y)? fmtNum(y): NaN}); }
  const roots = numericScanRoots(f, xMin, xMax, 4000).map(fmtNum);
  return {rows, roots};
}

function classifyExtremum(x, fpp, fppp, tol){
  const c2 = fpp(x);
  if(c2 > tol) return 'Minimum';
  if(c2 < -tol) return 'Maximum';
  const c3 = fppp(x);
  if(Math.abs(c3) > tol) return 'Sattelpunkt';
  return 'unklar';
}
function buildIntervals(criticalXs, sampleFn, xMin, xMax){
  const xs = criticalXs.slice().sort((a,b)=>a-b).filter(x=>isFinite(x));
  const bounds = [xMin, ...xs, xMax]; const intervals = [];
  for(let i=0;i<bounds.length-1;i++){
    const a=bounds[i], b=bounds[i+1]; if(b-a < 1e-9) continue;
    const mid = (a+b)/2; const s = sampleFn(mid);
    if(!isFinite(s)) continue;
    intervals.push({from:a, to:b, sign: s>0?1:(s<0?-1:0)});
  }
  return intervals;
}

function analyze(input){
  const tol = 1e-6;
  const astRaw = parse(input);
  const ast = simplifyFixed(astRaw, 6);
  const poly = astToPoly(ast);
  const f = x => { try{ return evaluate(ast,x); }catch(e){ return NaN; } };

  let polyD1=null, polyD2=null, polyD3=null;
  let fPrimeAst=null, fDoublePrimeAst=null, fTriplePrimeAst=null;
  if(poly){
    polyD1 = polyDerivative(poly); polyD2 = polyDerivative(polyD1); polyD3 = polyDerivative(polyD2);
  } else {
    fPrimeAst = simplifyFixed(diff(ast),6);
    fDoublePrimeAst = simplifyFixed(diff(fPrimeAst),6);
    fTriplePrimeAst = simplifyFixed(diff(fDoublePrimeAst),6);
  }
  const fp = poly ? (x=>hornerEvalDesc(polyD1.slice().reverse(), x)) : (x=>{try{return evaluate(fPrimeAst,x);}catch(e){return NaN;}});
  const fpp = poly ? (x=>hornerEvalDesc(polyD2.slice().reverse(), x)) : (x=>{try{return evaluate(fDoublePrimeAst,x);}catch(e){return NaN;}});
  const fppp = poly ? (x=>hornerEvalDesc(polyD3.slice().reverse(), x)) : (x=>{try{return evaluate(fTriplePrimeAst,x);}catch(e){return NaN;}});

  const fStr = poly ? polyToString(poly) : toStr(ast);
  const fpStr = poly ? polyToString(polyD1) : toStr(fPrimeAst);
  const fppStr = poly ? polyToString(polyD2) : toStr(fDoublePrimeAst);
  const fpppStr = poly ? polyToString(polyD3) : toStr(fTriplePrimeAst);

  const symmetry = poly ? polySymmetry(poly) : numericSymmetry(f);
  const domainGaps = poly ? [] : numericDomainGaps(f);
  const y0 = f(0);
  const endBehaviour = poly ? polyEndBehaviour(poly) : numericEndBehaviour(f);

  function rootReport(fn, polyCoeffs){
    if(polyCoeffs) return { mode:'exact', ...findPolynomialRoots(polyCoeffs) };
    const table = numericGuessTable(fn, -8, 8, 1);
    return { mode:'numeric', roots: table.roots, table: table.rows };
  }
  const rootsF = rootReport(f, poly);
  const rootsFp = rootReport(fp, poly? polyD1 : null);
  const rootsFpp = rootReport(fpp, poly? polyD2 : null);

  const extrema = rootsFp.roots.map(x=>({ x, y: fmtNum(f(x)), kind: classifyExtremum(x, fpp, fppp, tol) }));
  const inflection = rootsFpp.roots.map(x=>({
    x, y: fmtNum(f(x)),
    isInflection: Math.abs(fppp(x)) > tol,
    isSaddle: Math.abs(fppp(x)) > tol && Math.abs(fp(x)) < tol
  })).filter(p=>p.isInflection);

  const notable = [...rootsF.roots, ...extrema.map(e=>e.x), ...inflection.map(p=>p.x), 0];
  let plotMin=-10, plotMax=10;
  if(notable.length){
    const lo = Math.min(...notable), hi = Math.max(...notable);
    const span = hi-lo; const half = Math.max(span/2 + 2, 4); const center = (hi+lo)/2;
    plotMin = center-half; plotMax = center+half;
  }
  const domainBreaks = domainGaps.reduce((acc,g)=>{
    if(g.type==='point'||g.type==='below'||g.type==='above') acc.push(g.x);
    else if(g.type==='interval') acc.push(g.from, g.to);
    return acc;
  }, []);
  const monotony = buildIntervals([...extrema.map(e=>e.x), ...domainBreaks], fp, plotMin, plotMax);
  const curvature = buildIntervals([...inflection.map(p=>p.x), ...domainBreaks], fpp, plotMin, plotMax);

  return {
    input, isPolynomial: !!poly,
    fStr, fpStr, fppStr, fpppStr,
    symmetry, domainGaps, y0: fmtNum(y0), endBehaviour,
    rootsF, rootsFp, rootsFpp, extrema, inflection, monotony, curvature,
    plotRange:[plotMin,plotMax],
    evalF:f, evalFp:fp, evalFpp:fpp
  };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDisplay(v){
  if(v===Infinity) return '+inf';
  if(v===-Infinity) return '-inf';
  if(v===undefined || v===null || Number.isNaN(v)) return '--';
  let r = Math.round(v*10000)/10000;
  if(Object.is(r,-0)) r=0;
  return String(r);
}

const SOFTKEY_LABELS = ['FUNC','NULL','EXTR','WEND','MONO','GRAF'];

const state = {
  mode:'menu', // 'menu' | 'input' | 'error' | 'result'
  expr:'x^3-3x^2-4x+12',
  cursor: 'x^3-3x^2-4x+12'.length,
  page:0,
  scroll:0,
  result:null,
  errorMsg:''
};

function polyDescCompact(coeffsDesc){ return polyToString(coeffsDesc.slice().reverse()); }

function lowDegreeTextLines(detail){
  if(detail.type==='const') return ['konst. Rest '+fmtDisplay(detail.value)+' -> keine NST'];
  if(detail.type==='linear') return ['linear: '+fmtDisplay(detail.a)+'x'+(detail.b<0?'':'+')+fmtDisplay(detail.b)+'=0','x='+fmtDisplay(detail.root)];
  if(detail.type==='quadratic'){
    const {a,b,c,D,complex}=detail;
    const out=['quadr.: '+fmtDisplay(a)+'x^2'+(b<0?'':'+')+fmtDisplay(b)+'x'+(c<0?'':'+')+fmtDisplay(c)+'=0','D=b^2-4ac='+fmtDisplay(D)];
    if(complex) out.push('D<0 -> keine reelle NST');
    else if(Math.abs(D)<1e-9) out.push('x='+fmtDisplay(-b/(2*a))+' (doppelt)');
    else { const sq=Math.sqrt(D); out.push('x1='+fmtDisplay((-b+sq)/(2*a))+' x2='+fmtDisplay((-b-sq)/(2*a))); }
    return out;
  }
  return [];
}

function pageFunc(r){
  const lines = [];
  lines.push('f (x)='+r.fStr);
  lines.push("f'(x)="+r.fpStr);
  lines.push("f''(x)="+r.fppStr);
  lines.push("f'''(x)="+r.fpppStr);
  lines.push('');
  let domTxt;
  if(r.isPolynomial) domTxt='D: R (ganzrational)';
  else if(!r.domainGaps.length) domTxt='D: R (kein Def.-Luecke)';
  else domTxt='D: Luecke bei '+r.domainGaps.map(g=>{
    if(g.type==='point') return 'x='+fmtDisplay(g.x);
    if(g.type==='below') return 'x>'+fmtDisplay(g.x);
    if(g.type==='above') return 'x<'+fmtDisplay(g.x);
    return '['+fmtDisplay(g.from)+','+fmtDisplay(g.to)+']';
  }).join(',');
  lines.push(domTxt);
  lines.push('Sym: '+(r.symmetry==='even'?'gerade (y-Achse)':r.symmetry==='odd'?'ungerade (Ursprung)':'keine'));
  lines.push('y0: '+(isFinite(r.y0)? '(0|'+fmtDisplay(r.y0)+')' : 'n. definiert'));
  let endTxt;
  if(r.endBehaviour.kind==='poly') endTxt = 'x->-inf:'+(r.endBehaviour.left>0?'+inf':'-inf')+'  x->+inf:'+(r.endBehaviour.right>0?'+inf':'-inf');
  else if(r.endBehaviour.kind==='const') endTxt = 'f(x)='+fmtDisplay(r.endBehaviour.left)+' (konst.)';
  else {
    const m=t=>t.type==='infinite'?(t.sign>0?'+inf':'-inf'):t.type==='finite'?('~'+fmtDisplay(t.value)):t.type==='undefined'?'n.def.':'?';
    endTxt = '-inf:'+m(r.endBehaviour.left)+'  +inf:'+m(r.endBehaviour.right);
  }
  lines.push(endTxt);
  return lines;
}

function pageRoots(r){
  const lines = []; const rr = r.rootsF;
  if(rr.mode==='exact'){
    for(const s of rr.stages){
      if(s.type==='zero-root'){ lines.push('x=0 ist NST (a0=0)'); lines.push('Rest: '+polyDescCompact(s.after)); lines.push(''); }
      else if(s.type==='guess-table'){
        lines.push('Rate f. '+polyDescCompact(s.coeffs)+':');
        lines.push('(Teiler Absolutgl./Leitk.)');
        for(const row of s.table){
          const hit = row.x===s.found;
          lines.push((hit?'*':' ')+'x='+fmtDisplay(row.x)+' f='+fmtDisplay(row.fx)+(hit?' <NST':''));
        }
        if(s.found===null) lines.push('keine rationale NST');
        lines.push('');
      }
      else if(s.type==='horner-division'){
        lines.push('Horner /(x-('+fmtDisplay(s.root)+')):');
        lines.push('K: '+s.coeffs.map(c=>fmtDisplay(c)).join(' '));
        lines.push('Q: '+s.quotient.map(c=>fmtDisplay(c)).join(' ')+' R'+fmtDisplay(hornerEvalDesc(s.coeffs,s.root)));
        lines.push('');
      }
      else if(s.type==='low-degree'){ lines.push(...lowDegreeTextLines(s.detail)); lines.push(''); }
      else if(s.type==='numeric'){
        lines.push('Kein rat. NST in '+polyDescCompact(s.coeffs));
        lines.push(s.roots.length? ('numerisch: '+s.roots.map(fmtDisplay).join(', ')) : 'keine weitere NST');
        lines.push('');
      }
      else if(s.type==='skip-exact'){ lines.push('Koeff. zu gross/n.ganzz.'); lines.push('-> numerische Suche'); lines.push(''); }
    }
  } else {
    lines.push('Wertetabelle [-8,8]:');
    for(const row of rr.table) lines.push('x='+fmtDisplay(row.x)+'  f='+(isFinite(row.fx)?fmtDisplay(row.fx):'--'));
    lines.push('');
    lines.push('Bisektion: '+(rr.roots.length? rr.roots.map(fmtDisplay).join(', ') : 'keine gefunden'));
  }
  lines.push('------------------------');
  lines.push('NST: '+(rr.roots.length? rr.roots.map(x=>'x='+fmtDisplay(x)).join('  ') : 'keine reellen NST'));
  return lines;
}

function pageExtrema(r){
  const lines = ["Extremstellen (f'=0):",''];
  if(!r.extrema.length) lines.push('keine gefunden');
  for(const e of r.extrema){ lines.push('x='+fmtDisplay(e.x)+'  y='+fmtDisplay(e.y)); lines.push('  -> '+e.kind); }
  return lines;
}
function pageInflection(r){
  const lines = ["Wendepunkte (f''=0):",''];
  if(!r.inflection.length) lines.push('keine gefunden');
  for(const p of r.inflection){ lines.push('x='+fmtDisplay(p.x)+'  y='+fmtDisplay(p.y)); lines.push('  -> '+(p.isSaddle?'Sattelpunkt':'Wendepunkt')); }
  return lines;
}
function intervalLabelText(iv,xMin,xMax){
  const nearMin=Math.abs(iv.from-xMin)<1e-6, nearMax=Math.abs(iv.to-xMax)<1e-6;
  if(nearMin&&nearMax) return 'x aus R';
  if(nearMin) return 'x<'+fmtDisplay(iv.to);
  if(nearMax) return 'x>'+fmtDisplay(iv.from);
  return fmtDisplay(iv.from)+'<x<'+fmtDisplay(iv.to);
}
function pageMonotony(r){
  const lines = ['Monotonie:','']; const [xMin,xMax]=r.plotRange;
  for(const iv of r.monotony) lines.push(intervalLabelText(iv,xMin,xMax)+': '+(iv.sign>0?'steigend /':(iv.sign<0?'fallend \\':'konst.')));
  lines.push(''); lines.push('Kruemmung:');
  for(const iv of r.curvature) lines.push(intervalLabelText(iv,xMin,xMax)+': '+(iv.sign>0?'konvex u':(iv.sign<0?'konkav n':'--')));
  return lines;
}

const PAGE_FNS = [pageFunc, pageRoots, pageExtrema, pageInflection, pageMonotony];

function niceStep(range){
  const rough = range/6;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(rough,1e-9))));
  const norm = rough/mag;
  let step;
  if(norm<1.5) step=1; else if(norm<3) step=2; else if(norm<7) step=5; else step=10;
  return step*mag;
}

function drawGraphMono(canvas, r){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 300, cssH = canvas.clientHeight || 180;
  canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--lcd-ink').trim() || '#1f2a1a';
  const inkDim = 'rgba(31,42,26,0.35)';

  const [xMin,xMax] = r.plotRange;
  const N = 400; const pts = [];
  for(let i=0;i<=N;i++){ const x = xMin + (xMax-xMin)*i/N; const y = r.evalF(x); pts.push({x,y: isFinite(y)? y : NaN}); }
  const finiteYs = pts.map(p=>p.y).filter(y=>isFinite(y)).sort((a,b)=>a-b);
  if(finiteYs.length===0){ ctx.fillStyle=ink; ctx.font='11px monospace'; ctx.fillText('keine darstellbaren Werte',6,20); return; }
  const lo = finiteYs[Math.floor(finiteYs.length*0.03)];
  const hi = finiteYs[Math.min(finiteYs.length-1, Math.ceil(finiteYs.length*0.97))];
  let yMin = lo, yMax = hi;
  if(yMax-yMin < 1e-6){ yMin-=1; yMax+=1; }
  const pad = (yMax-yMin)*0.14; yMin -= pad; yMax += pad;

  const marginL=28, marginR=6, marginT=6, marginB=14;
  const plotW = cssW-marginL-marginR, plotH = cssH-marginT-marginB;
  function px(x){ return marginL + (x-xMin)/(xMax-xMin)*plotW; }
  function py(y){ return marginT + (1-(y-yMin)/(yMax-yMin))*plotH; }

  ctx.font='8px monospace';
  ctx.strokeStyle = inkDim; ctx.lineWidth=1; ctx.fillStyle = ink;
  const xStep = niceStep(xMax-xMin);
  for(let gx=Math.ceil(xMin/xStep)*xStep; gx<=xMax+1e-9; gx+=xStep){
    const X = px(gx);
    ctx.beginPath(); ctx.moveTo(X,marginT); ctx.lineTo(X,marginT+plotH); ctx.stroke();
    ctx.fillText(fmtDisplay(gx), X-6, marginT+plotH+11);
  }
  const yStep = niceStep(yMax-yMin);
  for(let gy=Math.ceil(yMin/yStep)*yStep; gy<=yMax+1e-9; gy+=yStep){
    const Y = py(gy);
    ctx.beginPath(); ctx.moveTo(marginL,Y); ctx.lineTo(marginL+plotW,Y); ctx.stroke();
    ctx.fillText(fmtDisplay(gy), 1, Y+3);
  }
  ctx.strokeStyle = ink; ctx.lineWidth=1.2;
  if(xMin<=0 && xMax>=0){ const X=px(0); ctx.beginPath();ctx.moveTo(X,marginT);ctx.lineTo(X,marginT+plotH);ctx.stroke(); }
  if(yMin<=0 && yMax>=0){ const Y=py(0); ctx.beginPath();ctx.moveTo(marginL,Y);ctx.lineTo(marginL+plotW,Y);ctx.stroke(); }

  ctx.strokeStyle = ink; ctx.lineWidth = 1.6; ctx.beginPath();
  let started=false; const spanY = yMax-yMin;
  for(const p of pts){
    if(!isFinite(p.y) || p.y<yMin-spanY*2 || p.y>yMax+spanY*2){ started=false; continue; }
    const X=px(p.x), Y=py(p.y);
    if(!started){ ctx.moveTo(X,Y); started=true; } else { ctx.lineTo(X,Y); }
  }
  ctx.stroke();

  function marker(x,y,shape){
    if(!isFinite(x) || !isFinite(y) || x<xMin||x>xMax) return;
    const X=px(x), Y=py(Math.max(yMin,Math.min(yMax,y)));
    ctx.fillStyle=ink; ctx.strokeStyle=ink;
    if(shape==='circle'){ ctx.beginPath(); ctx.arc(X,Y,2.6,0,Math.PI*2); ctx.fill(); }
    else if(shape==='square'){ ctx.fillRect(X-2.4,Y-2.4,4.8,4.8); }
    else if(shape==='tri'){ ctx.beginPath(); ctx.moveTo(X,Y-3.2); ctx.lineTo(X+3,Y+2.6); ctx.lineTo(X-3,Y+2.6); ctx.closePath(); ctx.fill(); }
  }
  r.rootsF.roots.forEach(x=>marker(x,0,'circle'));
  r.extrema.forEach(e=>marker(e.x,e.y,'square'));
  r.inflection.forEach(p=>marker(p.x,p.y,'tri'));
  if(isFinite(r.y0)) marker(0,r.y0,'circle');
}

function renderSoftkeys(){
  const wrap = document.getElementById('softkeys');
  wrap.innerHTML = SOFTKEY_LABELS.map((label,i)=>{
    const active = state.mode==='result' && state.page===i;
    return `<div class="softkey${active?' active':''}" data-fn="${i}">${label}</div>`;
  }).join('');
  wrap.querySelectorAll('.softkey').forEach(el=>{
    el.addEventListener('click', ()=>pressFn(+el.dataset.fn));
  });
}

function renderTextScreen(lines){
  const VISIBLE = 10;
  const maxScroll = Math.max(0, lines.length - VISIBLE);
  state.scroll = Math.min(Math.max(0,state.scroll), maxScroll);
  const shown = lines.slice(state.scroll, state.scroll+VISIBLE);
  const more = state.scroll < maxScroll, less = state.scroll > 0;
  return shown.map(l=>`<div class="lcd-line">${escapeHtml(l)}</div>`).join('')
    + `<div class="lcd-scrollhint">${less?'▲':''}${more?'▼':''}</div>`;
}

function renderMenuScreen(){
  return `<div class="lcd-menu">
    <div class="lcd-title">KURVEN-<br>ANALYSATOR</div>
    <div class="lcd-sub">EXE = berechnen<br>&lt; &gt; = Seite &nbsp; ^ v = scrollen<br>F1-F6 = Sprung zur Seite<br>AC = loeschen &middot; EXIT = zurueck</div>
  </div>`;
}

function renderInputScreen(){
  const before = escapeHtml(state.expr.slice(0,state.cursor));
  const after = escapeHtml(state.expr.slice(state.cursor));
  let body = `<div class="lcd-inputline">f(X)=${before}<span class="caret"></span>${after}</div>`;
  if(state.mode==='error') body += `<div class="lcd-error">FEHLER:\n${escapeHtml(state.errorMsg)}</div>`;
  else body += `<div class="lcd-hint">EXE druecken zum Berechnen</div>`;
  return body;
}

function render(){
  renderSoftkeys();
  const lcd = document.getElementById('lcd');
  if(state.mode==='menu'){ lcd.innerHTML = renderMenuScreen(); return; }
  if(state.mode==='input' || state.mode==='error'){ lcd.innerHTML = renderInputScreen(); return; }
  if(state.page===5){
    lcd.innerHTML = '<canvas id="lcdCanvas"></canvas>';
    requestAnimationFrame(()=>drawGraphMono(document.getElementById('lcdCanvas'), state.result));
    return;
  }
  const lines = PAGE_FNS[state.page](state.result);
  lcd.innerHTML = renderTextScreen(lines);
}

function pressChar(str){
  state.mode='input';
  state.expr = state.expr.slice(0,state.cursor)+str+state.expr.slice(state.cursor);
  state.cursor += str.length;
  render();
}
function pressAC(){ state.expr=''; state.cursor=0; state.mode='input'; state.result=null; render(); }
function pressDel(){
  if(state.mode!=='input'){ state.mode='input'; render(); return; }
  if(state.cursor>0){ state.expr = state.expr.slice(0,state.cursor-1)+state.expr.slice(state.cursor); state.cursor--; }
  render();
}
function pressExe(){
  if(state.mode==='menu'){ state.mode='input'; render(); return; }
  if(state.mode!=='input') return;
  try{
    state.result = analyze(state.expr);
    state.mode='result'; state.page=0; state.scroll=0;
  }catch(e){
    state.mode='error'; state.errorMsg = e.message||String(e);
  }
  render();
}
function pressExit(){
  if(state.mode==='result' || state.mode==='error') state.mode='input';
  else if(state.mode==='menu') state.mode='input';
  else pressAC();
  render();
}
function pressMenu(){ state.mode='menu'; render(); }
function pressFn(i){ if(state.mode!=='result') return; state.page=i; state.scroll=0; render(); }
function pressArrow(dir){
  if(state.mode==='menu' || state.mode==='error'){ state.mode='input'; render(); return; }
  if(state.mode==='input'){
    if(dir==='left') state.cursor=Math.max(0,state.cursor-1);
    if(dir==='right') state.cursor=Math.min(state.expr.length,state.cursor+1);
    render(); return;
  }
  if(state.mode==='result'){
    if(dir==='left') { state.page=(state.page+5)%6; state.scroll=0; }
    if(dir==='right'){ state.page=(state.page+1)%6; state.scroll=0; }
    if(dir==='up') state.scroll=Math.max(0,state.scroll-1);
    if(dir==='down') state.scroll=state.scroll+1;
    render(); return;
  }
}

function wireButtons(){
  document.querySelectorAll('[data-char]').forEach(btn=>{
    btn.addEventListener('click', ()=>pressChar(btn.dataset.char));
  });
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    btn.addEventListener('click', ()=>pressArrow(btn.dataset.dir));
  });
  document.getElementById('btnAC').addEventListener('click', pressAC);
  document.getElementById('btnDel').addEventListener('click', pressDel);
  document.getElementById('btnExe').addEventListener('click', pressExe);
  document.getElementById('btnExit').addEventListener('click', pressExit);
  document.getElementById('btnMenu').addEventListener('click', pressMenu);
  document.getElementById('btnShift').addEventListener('click', ()=>flash('btnShift'));
  document.getElementById('btnAlpha').addEventListener('click', ()=>flash('btnAlpha'));
}
function flash(id){
  const el = document.getElementById(id);
  el.style.background = 'var(--accent)';
  setTimeout(()=>{ el.style.background=''; }, 140);
}

document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ pressExe(); e.preventDefault(); return; }
  if(e.key==='Backspace'){ pressDel(); e.preventDefault(); return; }
  if(e.key==='Escape'){ pressExit(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft'){ pressArrow('left'); e.preventDefault(); return; }
  if(e.key==='ArrowRight'){ pressArrow('right'); e.preventDefault(); return; }
  if(e.key==='ArrowUp'){ pressArrow('up'); e.preventDefault(); return; }
  if(e.key==='ArrowDown'){ pressArrow('down'); e.preventDefault(); return; }
  if(e.key.length===1 && /[0-9a-zA-Zx+\-*/^().,]/.test(e.key)){ pressChar(e.key); e.preventDefault(); return; }
});

function fitStage(){
  const stage = document.getElementById('stage');
  const designWidth = 380;
  const available = Math.min(window.innerWidth-20, 460);
  const scale = Math.min(1.2, available/designWidth);
  stage.style.transform = 'scale('+scale+')';
}
window.addEventListener('resize', fitStage);

wireButtons();
fitStage();
render();

})();
</script>
</body>
